<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Estimateur Prix Voiture</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Estimation Auto</a>

        <div class="ms-auto d-flex align-items-center">
            <a href="/stats" class="nav-link text-white me-3">Statistiques</a>
            <a href="/logout" class="btn btn-outline-danger btn-sm">Déconnexion</a>
        </div>
    </div>
</nav>
<body class="container mt-5">
    <h2 class="mb-4">Estimation du prix d'un véhicule</h2>
    
    <form action="/predict" method="post" class="row g-3">
        <div class="col-md-4">
            <label>Ville</label>
            <select name="location" class="form-select">
                <option value="Mumbai">Mumbai</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Kochi">Kochi</option>
                <option value="Coimbatore">Coimbatore</option>
                <option value="Prune">Prune</option>
                <option value="Delhi">Delhi</option>
                <option value="Kolkata">Kolkata</option>
                <option value="Chennai">Chennai</option>
                <option value="Jaipur">Jaipur</option>
                <option value="Bangalore">Bangalore</option>
                <option value="Ahmedabad">Ahmedabad</option>
            </select>
        </div>
        <div class="col-md-4">
            <label>Année</label>
            <input type="number" name="year" class="form-control" placeholder="ex: 2018" required>
        </div>
        <div class="col-md-4">
            <label>Kilométrage</label>
            <input type="number" name="km" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label>Carburant</label>
            <select name="fuel" class="form-select">
                <option value="Petrol">Essence</option>
                <option value="Diesel">Diesel</option>
                <option value="CNG">CNG</option>
                <option value="LPG">LPG</option>
            </select>
        </div>
        <div class="col-md-4">
            <label>Boîte</label>
            <select name="transmission" class="form-select">
                <option value="Manual">Manuelle</option>
                <option value="Automatic">Automatique</option>
            </select>
        </div>
        <div class="col-md-4">
            <label>Puissance (bhp)</label>
            <input type="number" name="power" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label>Type de propriétaire</label>
            <select name="owner" class="form-select">
                <option value="First">Premier main</option>
                <option value="Second">Deuxième main</option>
                <option value="Third">Troisième main</option>
                <option value="Fourth & Above">Quatrième main ou plus</option>
            </select>
        </div>
        <div class="col-md-6">
            <label>Mileage</label>
            <input type="number" name="mileage" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label>Marque</label>
            <input type="text" name="brand" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label>Modèle</label>
            <input type="text" name="model" class="form-control" required>
        </div>
        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-primary w-100">Estimer le prix</button>
        </div>
    </form>

    {% if prediction %}
    <div class="alert alert-success mt-4">
        <h4>Prix estimé : {{ prediction }} €</h4>
    </div>
    {% endif %}
</body>

</html>
